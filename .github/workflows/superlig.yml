name: Super Lig Tum Kadrolar

on:
  schedule:
    # API çakışmasını önlemek için Konyaspor'dan 1 gün sonra (Ayın 2'si) çalışır
    - cron: '0 0 2 * *'
  workflow_dispatch: 

jobs:
  update-superlig:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Süper Lig Takımlarını Çek
      run: |
        # Varsa eski klasörü sil ve tertemiz bir klasör aç (Küme düşenleri temizlemek için)
        rm -rf squads
        mkdir -p squads
        
        # --- DİNAMİK SEZON HESAPLAMA ---
        CURRENT_MONTH=$(date +%-m) # Başındaki 0 olmadan mevcut ay
        CURRENT_YEAR=$(date +%Y)   # Mevcut yıl
        
        if [ "$CURRENT_MONTH" -lt 8 ]; then
          SEASON=$((CURRENT_YEAR - 1))
        else
          SEASON=$CURRENT_YEAR
        fi
        
        echo "Hesaplanan Sezon: $SEASON yılı Süper Lig (203) takımları çekiliyor..."
        # -------------------------------
        
        # Ligdeki takımların listesini gecici bir dosyaya çek
        curl -s -X GET "https://v3.football.api-sports.io/teams?league=203&season=$SEASON" \
        -H "x-apisports-key: ${{ secrets.API_KEY }}" \
        -o takimlar.json
        
        # jq aracı ile JSON'dan sadece Takım ID'lerini ayıkla
        TEAM_IDS=$(jq '.response[].team.id' takimlar.json)
        
        # Bulunan her bir takım ID'si için döngü başlat
        for ID in $TEAM_IDS; do
          echo "Takım $ID kadrosu çekiliyor..."
          
          # Takımın kadrosunu çek ve squads/takim_ID.json olarak kaydet
          curl -s -X GET "https://v3.football.api-sports.io/players/squads?team=$ID" \
          -H "x-apisports-key: ${{ secrets.API_KEY }}" \
          -o "squads/takim_$ID.json"
          
          # KRİTİK: API'nin "Dakikada 10 İstek" sınırına takılmamak için 7 saniye bekle
          sleep 7 
        done
        
        # İşi biten geçici takımlar dosyasını sil
        rm -f takimlar.json
        
    - name: Degisiklikleri Kaydet (Commit & Push)
      run: |
        git config --global user.name "SuperLig Botu"
        git config --global user.email "actions@github.com"
        
        # Yeni oluşan squads klasörünü (ve silinen eski dosyaları) git'e ekle
        git add --all squads/
        
        git diff --quiet && git diff --staged --quiet || (git commit -m "Süper Lig Kadrolari Guncellendi" && git push)
