name: Super Lig Tum Kadrolar
on:
  schedule:
    - cron: '0 0 2 * *'
  workflow_dispatch:

jobs:
  update-superlig:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Süper Lig Takımlarını Çek ve Birleştir
        run: |
          mkdir -p temp_squads
          SEASON=2025
          
          echo "API'ye istek atılıyor..."
          curl -s -X GET "https://v3.football.api-sports.io/teams?league=203&season=$SEASON" -H "x-apisports-key: ${{ secrets.API_KEY }}" -o takimlar.json
          
          echo "API'DEN GELEN CEVAP:"
          cat takimlar.json
          echo ""
          
          # Hata korumalı JSON okuma
          TEAM_IDS=$(jq -r '.response[].team.id // empty' takimlar.json)
          
          if [ -z "$TEAM_IDS" ]; then
            echo "KRİTİK HATA: Takım ID'leri bulunamadı! API Anahtarınızı (API_KEY) kontrol edin veya günlük limitinizi doldurmuş olabilirsiniz."
            exit 1
          fi
          
          for ID in $TEAM_IDS; do
            if [ "$ID" = "607" ]; then
              echo "Konyaspor (ID: 607) atlanıyor..."
              continue
            fi
            
            echo "Takım $ID kadrosu çekiliyor..."
            curl -s -X GET "https://v3.football.api-sports.io/players/squads?team=$ID" -H "x-apisports-key: ${{ secrets.API_KEY }}" -o "temp_squads/$ID.json"
            sleep 7 
          done
          
          # Eğer klasörde json dosyası varsa birleştir, yoksa hata verip çökmesini engelle
          if ls temp_squads/*.json 1> /dev/null 2>&1; then
            echo "Bütün dosyalar tek bir JSON'da birleştiriliyor..."
            jq -s '{ response: [ .[].response[0] | select(. != null) ] }' temp_squads/*.json > superlig_squads.json
          else
            echo "KRİTİK HATA: Birleştirilecek hiçbir kadro dosyası bulunamadı!"
            exit 1
          fi
          
          rm -rf temp_squads takimlar.json
          
      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name "SuperLig Botu"
          git config --global user.email "actions@github.com"
          git add superlig_squads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Süper Lig Tek Dosya Olarak Guncellendi (2025 Sezonu)" && git push)
